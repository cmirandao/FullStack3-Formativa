<div class="container mt-4">
  <h2 class="mb-4">Gestión de Biblioteca - Duoc UC</h2>

  <!-- Formulario de Registro / Edición -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">
      {{ modoEdicion ? 'Actualizar Libro' : 'Registrar Nuevo Libro' }}
    </div>
    <div class="card-body">
      <form (ngSubmit)="guardarLibro()">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" [(ngModel)]="libroForm.titulo" name="titulo" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Autor</label>
            <input type="text" class="form-control" [(ngModel)]="libroForm.autor" name="autor" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Año</label>
            <input type="number" class="form-control" [(ngModel)]="libroForm.anioPublicacion" name="anioPublicacion" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Género</label>
            <input type="text" class="form-control" [(ngModel)]="libroForm.genero" name="genero" required>
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button type="submit" class="btn btn-success w-100">{{ modoEdicion ? 'Actualizar' : 'Guardar' }}</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de Resultados -->
  <div class="card shadow-sm">
    <div class="card-header bg-secondary text-white">Listado de Libros</div>
    <div class="card-body">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Año</th>
            <th>Género</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let libro of libros">
            <td>{{ libro.id }}</td>
            <td>{{ libro.titulo }}</td>
            <td>{{ libro.autor }}</td>
            <td>{{ libro.anioPublicacion }}</td>
            <td>{{ libro.genero }}</td>
            <td>
              <button class="btn btn-warning btn-sm me-2" (click)="editarLibro(libro)">Editar</button>
              <button class="btn btn-danger btn-sm" (click)="eliminarLibro(libro.id)">Eliminar</button>
            </td>
          </tr>
          <tr *ngIf="libros.length === 0">
            <td colspan="6" class="text-center">No hay libros registrados.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
